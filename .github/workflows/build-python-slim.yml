name: build-python-slim
# Base SLIM durcie (non-distroless) pour les apps scientifiques (scipy/scikit-learn)
# que le distroless DHI ne couvre pas. Construite depuis python:<ver>-slim + libgomp1
# + non-root uid 65532, Trivy-gatée, poussée en tag mouvant base/python-slim:<ver>
# (rebuild nocturne pour les patchs slim ; consommateurs épinglent par digest via Renovate),
# puis copiée à l'identique (même digest) sur ghcr.io/soma-smart/base/python-slim pour le pod de build des MCP.
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC (après le mirror DHI de 02:00)
  workflow_dispatch: {}
  # ⚠️ Une modification du socle qui ne se vérifie qu'APRÈS le merge se vérifie en
  # production : la seule façon de savoir si le Dockerfile construit encore était de
  # merger puis de déclencher à la main. On construit donc aussi sur PR — sans
  # publier, cf. la garde `github.event_name` sur le step Push.
  # `paths` restreint le déclenchement à ce qui peut réellement casser le build : une
  # PR Renovate sur `renovate-config.js` n'a pas à réveiller un runner ARC.
  pull_request:
    paths:
      - "python-slim/**"
      - ".github/workflows/build-python-slim.yml"
concurrency:
  group: build-python-slim
  cancel-in-progress: false
jobs:
  build:
    runs-on: onprem-dev-base-images
    # `packages: write` : la copie vers ghcr (step ci-dessous) s'authentifie avec le GITHUB_TOKEN du job.
    # Pour ghcr, jamais de PAT : un PAT classique `write:packages` couvre tous les packages de son propriétaire.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install trivy
        # Runner ARC non-root → installe dans un répertoire writable + PATH.
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Login Docker Hub (pull python:<ver>-slim — évite le rate-limit anonyme)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
        run: echo "$DOCKERHUB_PAT" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Login Harbor (push base)
        # Inutile sur une PR, qui ne publie pas : le chemin de PR n'a besoin d'aucun credential
        # d'écriture sur Harbor. ⚠️ Le `packages: write` du job (ghcr) est, lui, accordé aussi aux PR :
        # inutilisé sur ce chemin (steps ghcr exclus), mais présent — jeton en lecture seule sur les forks.
        if: github.event_name != 'pull_request'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "$HARBOR_PASSWORD" | docker login registry-dev.soma-smart.cloud -u "$HARBOR_USERNAME" --password-stdin
      - name: Build (--pull → dernier python:<ver>-slim pour les patchs)
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          docker build --pull \
            --build-arg PY_VERSION="$VERSION" \
            -t "registry-dev.soma-smart.cloud/base/python-slim:${VERSION}" \
            -f python-slim/Dockerfile python-slim
      - name: Trivy gate (couverture PROUVÉE, puis CVE fixable Critical/High = échec)
        # ⚠️ Le verdict est rendu en Python, PAS par `--exit-code 1`. Un scan qui
        # n'analyse RIEN sort 0 : le gate serait alors vert par AVEUGLEMENT, et un
        # gate incapable de distinguer « rien trouvé » de « rien cherché » ne prouve
        # rien. Le risque est concret ICI : ce socle retire déjà pip et ensurepip, et
        # tout allègement futur de sa base de paquets produirait exactement ce cas.
        #
        # ⚠️ « L'OS a été identifié » NE SUFFIT PAS : la détection lit
        # `/etc/os-release`, indépendamment de toute énumération de paquets. On asserte
        # donc l'INVENTAIRE : un `os-pkgs` non vide. Portage du gate de
        # soma-smart/multica-runtime, où ces trois pièges sont documentés en détail.
        #
        # ⚠️ Aucun mécanisme d'exception ici, et c'est délibéré : une base est le seul
        # endroit où une CVE corrigeable se corrige VRAIMENT (cf. le `dist-upgrade` du
        # Dockerfile). Une porte de tolérance posée sur le socle deviendrait opposable
        # à tous ses consommateurs d'un coup.
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -eu
          IMAGE="registry-dev.soma-smart.cloud/base/python-slim:${VERSION}"
          trivy image --format json --list-all-pkgs \
            --ignore-unfixed --severity CRITICAL,HIGH \
            "$IMAGE" > trivy.json

          # Verdict commun à tous les socles : `scripts/verdict_trivy.py` (testé par `scripts/test_verdict_trivy.py`).
          python3 scripts/verdict_trivy.py trivy.json "$IMAGE"
      - name: Push (idempotent — no-op si digest inchangé)
        # ⚠️ JAMAIS sur une PR : une PR construit et scanne pour prouver que le socle
        # tient encore, elle ne publie pas. Publier depuis une branche non mergée
        # redigesterait le tag mouvant que tous les consommateurs épinglent.
        # `ref == main` : un `workflow_dispatch` depuis une branche pousserait sinon le tag mouvant que tous les
        # consommateurs épinglent, SANS copie ghcr (ses steps sont limités à main) — puis pinguerait le succès :
        # Harbor et ghcr divergeraient en silence et le dead-man's switch serait remis à zéro.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ matrix.version }}
        run: docker push "registry-dev.soma-smart.cloud/base/python-slim:${VERSION}"

      - name: Copier vers ghcr (même digest, lisible en anonyme, sinon échec)
        # Installation de crane ET copie dans UN seul step : deux steps portant la même condition pouvaient diverger à
        # l'édition (installation sautée = rouge bruyant ; copie sautée = vert et ping de succès, silencieux).
        # Version de crane ÉPINGLÉE + SHA-256 vérifié (pas de script `main` flottant comme pour trivy) : cet outil écrit sur
        # ghcr avec un jeton à droits d'écriture. ⚠️ Dette : aucun manager Renovate ne voit cette version — à bumper à la main.
        # Le pod de build des MCP (namespace arc-mcp) ne peut PAS joindre Harbor : il tire ses bases d'ici, en anonyme — le
        # package ghcr doit donc être PUBLIC (geste manuel, cf. README). Copie APRÈS le gate Trivy et le push Harbor, par
        # digest ; placée AVANT « Signal de vie » : un échec fait pinger `/fail`, la copie est couverte par le dead-man's
        # switch existant. `ref == main` : une branche ne doit pas publier sur un registre PUBLIC.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ matrix.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -sfL -o /tmp/crane.tgz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tgz" | sha256sum -c -
          tar -xzf /tmp/crane.tgz -C "$HOME/.local/bin" crane
          export PATH="$HOME/.local/bin:$PATH"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 scripts/copie_ghcr.py \
            "registry-dev.soma-smart.cloud/base/python-slim:${VERSION}" \
            "ghcr.io/soma-smart/base/python-slim:${VERSION}"

      - name: Signal de vie (dead-man's switch)
        # ⚠️ Ce job a échoué QUATRE NUITS d'affilée (2026-08-17 → 20) sans que personne
        # ne le sache, et c'est ce silence qui a coûté la panne : la base n'était plus
        # republiée, donc plus aucun consommateur du socle ne pouvait produire une
        # image verte. Un rouge que personne ne reçoit n'est pas une alerte, c'est une
        # trace posthume.
        #
        # Healthchecks.io, comme le Watchdog de l'alerting : le ping de succès est ce
        # qui compte, parce qu'il attrape AUSSI les pannes qu'un `if: failure()` ne
        # verrait jamais — job qui ne démarre pas, runner ARC absent, cron désactivé,
        # dépôt sorti de l'installation de l'App.
        #
        # ⚠️ `if: always()` est structurant : sans lui, le step serait sauté
        # précisément quand il a quelque chose à dire.
        #
        # ⚠️ La matrice ne porte qu'une version. Si elle s'élargit, une URL unique
        # ferait qu'un succès `3.15` masquerait un échec `3.14` — prévoir alors une
        # check par version, pas un ping partagé.
        #
        # ⚠️ Exclu sur PR, et ce n'est pas un détail : un succès de PR pingerait la
        # check et REPOUSSERAIT l'échéance du dead-man's switch — une nuit rouge
        # passerait alors inaperçue parce que quelqu'un a ouvert une PR verte entre
        # deux. Le signal doit rester celui de l'exécution qui publie.
        # Mêmes conditions que la publication : le signal est celui de l'exécution qui publie (donc pas d'une branche).
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_URL_BUILD_PYTHON_SLIM }}
          RESULTAT: ${{ job.status }}
        run: |
          set -eu
          if [ -z "${HC_URL:-}" ]; then
            echo "::warning::Secret HEALTHCHECKS_URL_BUILD_PYTHON_SLIM absent : le dead-man's switch est INERTE, un échec nocturne n'alertera personne."
            {
              echo "### ⚠️ Dead-man's switch inerte"
              echo
              echo "Le secret \`HEALTHCHECKS_URL_BUILD_PYTHON_SLIM\` n'est pas défini."
              echo "Ce build est surveillé par personne — cf. README, section « Surveillance »."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RESULTAT" = "success" ]; then
            curl -fsS -m 10 --retry 3 "$HC_URL" > /dev/null
          else
            curl -fsS -m 10 --retry 3 "$HC_URL/fail" > /dev/null
          fi
          echo "ping envoyé — statut $RESULTAT"
