name: renovate
# Boucle de remediation CVE — outil UNIQUE et homogene sur tous les repos d'apps.
# Renovate self-hosted sur le runner interne (atteint le Harbor prive via hostRules).
# Config globale unique = renovate-config.js (requireConfig: ignored). autodiscover =>
# l'installation de l'App soma-base-bumper definit les repos consommateurs.
# Cf. spec 2026-07-06.
on:
  schedule:
    - cron: "0 6,12,18 * * *"   # 3x/jour UTC (apres le mirror-dhi de 02:00)
    # Passe de MERGE du bump de digest nocturne. L'automerge est cote Renovate
    # (org Free, platformAutomerge: false) : il ne merge qu'a un run ULTERIEUR,
    # une fois le ci-docker-build de la PR vert. Sans cette passe, la PR ouverte a
    # ~02:40 attendait 12:00 pour etre mergee.
    - cron: "15 3 * * *"
  # Enchaine sur le mirror-dhi : la PR de digest s'ouvre des que la nouvelle base
  # est poussee (~02:35), et non plus a 06:00.
  # ⚠️ POURQUOI C'EST URGENT ET PAS UN CONFORT : la retention Harbor du projet
  # `base` (latestPushedK=3 par depot) + le GC delete_untagged font disparaitre
  # l'ancien digest en quelques heures (constate le 2026-10-08 : < 8 h). Entre le
  # push du mirror et le merge du bump, tout build d'app qui epingle l'ancien
  # digest echoue (`not found`) — CD pilotage-app casse les 2026-10-07 et 08.
  workflow_run:
    workflows: ["mirror-dhi"]
    types: [completed]
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate LOG_LEVEL"
        default: "info"
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    # Sur workflow_run : seulement si le mirror a reussi (sinon pas de nouvelle base).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: onprem-dev-base-images
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BASE_BUMPER_APP_ID }}
          private-key: ${{ secrets.BASE_BUMPER_PRIVATE_KEY }}
          owner: soma-smart
          # pas de 'repositories' => token sur TOUTES les installations de l'App = les consommateurs
      - name: Checkout (config global renovate-config.js)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # ⚠️ RÉPERTOIRE PARTAGÉ, ET C'EST TOUT LE SUJET. Le runner est en mode dind : le
      # `docker run` construit par l'action est exécuté par le démon dind, donc un
      # `-v /tmp:/tmp` monte le /tmp DU DÉMON, pas celui de cette étape. Mesuré le
      # 2026-09-14 : la variable et le volume arrivaient bien au conteneur, et le
      # fichier restait pourtant introuvable ici.
      # Ce qui traverse est PROUVÉ, pas supposé : le rendu réel du chart ARC
      # (`k8s/infra/arc/values-runner-base-images.yaml`, containerMode dind) monte le
      # volume `work` ENTIER au même chemin dans les conteneurs `runner` et `dind` —
      # `/home/runner/_work` — et ne monte `/tmp` nulle part. Tout `_work` traverse
      # donc, pas seulement le fichier de config que l'action y dépose.
      #
      # ⚠️ SOURCE UNIQUE DU CHEMIN, VIA $GITHUB_ENV. Ce chemin est nécessaire à TROIS
      # endroits (le montage, la variable donnée à Renovate, le gate) ; l'écrire trois
      # fois créerait un risque de divergence purement mécanique — un seul renommage
      # manqué et le gate lirait un fichier que personne n'a écrit, EACCES ou fichier
      # absent, rouge permanent qui se fait neutraliser. Le contexte `runner` n'est PAS
      # disponible dans un `env:` de job, d'où le calcul ici, une seule fois.
      #
      # ⚠️ RUNNER_TEMP EST UNE CONVENTION DU RUNNER, PAS UNE GARANTIE DE CE FICHIER.
      # Que $RUNNER_TEMP vive sous `_work` (donc sous le volume partagé avec le dind)
      # n'est vrai QUE parce que c'est ainsi que actions/runner le pose aujourd'hui.
      # On le vérifie plutôt que d'en hériter en silence.
      #
      # ⚠️ 0777 : le conteneur Renovate tourne en UID 12021, ce répertoire appartient
      # au runner. Sans ça l'écriture échoue et le journal n'existe jamais — le gate
      # deviendrait rouge en permanence, donc se ferait neutraliser. L'action expose un
      # `docker-user` qui éviterait la question, mais l'image attend le HOME de 12021 —
      # ouvrir le répertoire est le compromis le moins cher sur un pod éphémère
      # mono-tenant où le risque d'un tiers qui y écrirait est nul.
      #
      # ⚠️ CHEMIN COMPLET EN MINUSCULES, ASSERTÉ — répertoire ET nom de fichier.
      # `getEnv` de Renovate applique `.toLowerCase()` à la VALEUR ENTIÈRE, pas
      # seulement à la clé : un chemin portant une majuscule ferait écrire le journal
      # ailleurs, sans un mot, et le gate lirait un fichier absent. On refuse de
      # démarrer plutôt que de le découvrir en rouge.
      - name: Préparer le journal partagé
        run: |
          case "$RUNNER_TEMP" in
            /home/runner/_work/*) ;;
            *)
              echo "::error::RUNNER_TEMP ($RUNNER_TEMP) hors du volume partagé avec le dind" >&2
              echo "        le journal serait écrit dans un système de fichiers invisible" >&2
              echo "        du gate, exactement le bug corrigé par cette étape." >&2
              exit 1
              ;;
          esac
          JOURNAL_DIR="$RUNNER_TEMP/renovate-journal"
          JOURNAL="$JOURNAL_DIR/run-${{ github.run_id }}-${{ github.run_attempt }}.ndjson"
          if [ "$JOURNAL" != "$(printf '%s' "$JOURNAL" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::le chemin du journal contient une majuscule : $JOURNAL" >&2
            echo "        Renovate met la valeur de RENOVATE_LOG_FILE en minuscules," >&2
            echo "        le journal atterrirait ailleurs et le gate lirait du vide." >&2
            exit 1
          fi
          mkdir -p "$JOURNAL_DIR"
          chmod 0777 "$JOURNAL_DIR"
          {
            echo "JOURNAL_DIR=$JOURNAL_DIR"
            echo "JOURNAL=$JOURNAL"
          } >> "$GITHUB_ENV"

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@b50d2ba2bd928235abdcc14d06dfafc217f1c565 # v46.1.18
        with:
          # ⚠️ Les montages sont séparés par `;` (et non par une virgule ni un saut de
          # ligne) — `input.ts` fait un `.split(";")`. Le défaut `/tmp:/tmp` est
          # conservé, il sert à Renovate lui-même.
          docker-volumes: /tmp:/tmp;${{ env.JOURNAL_DIR }}:${{ env.JOURNAL_DIR }}
          configurationFile: renovate-config.js
          token: ${{ steps.app-token.outputs.token }}
          # ⚠️ EXPLICITE, ET PAS LE DÉFAUT DE L'ACTION — sinon la version de Renovate
          # bouge TOUTE SEULE et sans revue. Le défaut de `renovate-version` est une
          # valeur interne à l'action : il valait '43' en v46.1.18 et '44' dès
          # v46.2.0. Or les bumps mineurs de `github-actions` sont AUTOMERGÉS ici
          # (cf. renovate-config.js) → l'outil qui garde tout le parc contre la
          # dérive dériverait lui-même, en silence, sur un bump d'action anodin.
          # ⚠️ Doit rester égale à `VERSION_RENOVATE` de validate-renovate-config.yml :
          # valider contre une version différente de celle qui tourne est exactement
          # ce qui a produit l'incident du 2026-08-11. Les deux se bumpent ENSEMBLE.
          renovate-version: "43"
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Journal STRUCTURÉ, en plus de la sortie console : l'étape suivante doit
          # statuer sur des faits, pas sur du texte coloré par des séquences ANSI.
          #
          # ⚠️ PRÉFIXE `RENOVATE_` OBLIGATOIRE, ET CE N'EST PAS DU STYLE. L'action ne
          # transmet pas l'environnement du runner : elle le FILTRE avant de construire
          # son `docker run`, sur
          #   ^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|…)$
          # `LOG_FILE` ne passe pas ce filtre. Renovate honore les deux noms, mais seul
          # le préfixé atteint le conteneur. Le `LOG_LEVEL:` nu juste au-dessus marche,
          # lui, depuis toujours — ce qui rend la forme non préfixée plausible par
          # mimétisme. C'est exactement le piège « cohérent avec la ligne d'à côté ».
          #
          # ⚠️ CHEMIN ABSOLU, DANS LE RÉPERTOIRE PARTAGÉ PRÉPARÉ CI-DESSUS (`env.JOURNAL`,
          # calculé UNE SEULE FOIS, cf. l'étape précédente). Un chemin relatif se
          # résoudrait contre le WORKDIR du conteneur (`/usr/src/app`), qui part avec le
          # `--rm`. Et `/tmp` NE CONVIENT PAS malgré son montage par défaut : en dind,
          # c'est le /tmp du démon, invisible d'ici (mesuré).
          #
          # ⚠️ NOM UNIQUE PAR RUN ET PAR TENTATIVE — le pod ARC est ÉPHÉMÈRE (`work` en
          # `emptyDir`), donc ce n'est plus une protection contre un journal PÉRIMÉ qui
          # SURVIVRAIT d'un run à l'autre. L'invariant qu'il tient reste réel : un
          # journal ne doit jamais pouvoir être confondu avec celui d'un autre run ou
          # d'une nouvelle tentative du même run, si jamais l'éphémérité du pod venait à
          # changer (runner partagé, cache de volume) sans que ce fichier ne bouge.
          RENOVATE_LOG_FILE: ${{ env.JOURNAL }}
          # ⚠️ NI `debug` (trop bruyant, coûte cher en I/O sur un run 3x/jour) NI `warn`
          # (rendrait le gate ROUGE SUR CHAQUE RUN SAIN : `Repository finished`, que le
          # gate exige pour prouver qu'un dépôt a été traité, est journalisé en `info` —
          # `lib/workers/repository/index.ts` — et le flux fichier tombe en `debug` par
          # défaut si omis). `info` est la valeur la plus ÉTROITE qui capture encore
          # à la fois `Package lookup failures` (`warn`) et `Repository finished`
          # (`info`) : ne pas la resserrer sans relire `scripts/verifier-lookups.py`.
          RENOVATE_LOG_FILE_LEVEL: info

      # ⚠️ UN ÉCHEC DE LOOKUP NE DOIT PLUS ÊTRE SILENCIEUX. Quand une datasource ne
      # résout pas, Renovate n'ouvre aucune PR et écrit un avertissement dans le CORPS
      # de la Dependency Dashboard — le job reste VERT. L'épingle gèle alors comme si
      # personne ne la suivait, et c'est indiscernable de « rien à mettre à jour ».
      # Le rationale complet et les modes d'échec sont dans le script.
      #
      # ⚠️ `if: always()` : sans lui, un échec de Renovate lui-même sauterait le gate,
      # et l'absence de gate se lirait comme une absence de problème.
      #
      # ⚠️ Le nom de l'étape dit ce qui est PROUVÉ, pas la conclusion qu'on espère : le
      # gate atteste que toute résolution tentée a abouti, jamais que « tout est
      # suivi ». Ses angles morts sont listés en tête du script — les lire avant de
      # conclure quoi que ce soit d'un vert.
      #
      # ⚠️ DÉLIBÉRÉMENT BRUYANT : une indisponibilité amont passagère rendra le job
      # rouge le temps d'un run. Compromis assumé — un rouge qui se répare seul coûte
      # un coup d'œil, un gel silencieux a coûté des semaines.
      # ⚠️ DISTINGUER « PLOMBERIE CASSÉE » DE « RENOVATE MORT ». Les deux donnent le
      # même message côté script (« journal illisible ») ; en cas de rouge, ce `ls -l`
      # tranche en une seconde ce qu'il faudrait sinon reconstituer depuis les logs du
      # step précédent — répertoire absent/vide ⇒ le problème est dans CE fichier,
      # répertoire présent avec le bon fichier ⇒ Renovate lui-même a échoué avant
      # d'écrire, ou tôt dans son run.
      - name: État du journal (diagnostic)
        if: always()
        run: |
          ls -la "${{ env.JOURNAL_DIR }}" 2>&1 || echo "répertoire absent : ${{ env.JOURNAL_DIR }}"

      - name: Toutes les datasources ont résolu (gate)
        if: always()
        run: python3 scripts/verifier-lookups.py "${{ env.JOURNAL }}"
