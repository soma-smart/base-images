name: renovate
# Boucle de remediation CVE — outil UNIQUE et homogene sur tous les repos d'apps.
# Renovate self-hosted sur le runner interne (atteint le Harbor prive via hostRules).
# Config globale unique = renovate-config.js (requireConfig: ignored). autodiscover =>
# l'installation de l'App soma-base-bumper definit les repos consommateurs.
# Cf. spec 2026-07-06.
on:
  schedule:
    - cron: "0 6,12,18 * * *"   # 3x/jour UTC (apres le mirror-dhi de 02:00)
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate LOG_LEVEL"
        default: "info"
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    runs-on: onprem-dev-base-images
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BASE_BUMPER_APP_ID }}
          private-key: ${{ secrets.BASE_BUMPER_PRIVATE_KEY }}
          owner: soma-smart
          # pas de 'repositories' => token sur TOUTES les installations de l'App = les consommateurs
      - name: Checkout (config global renovate-config.js)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@b50d2ba2bd928235abdcc14d06dfafc217f1c565 # v46.1.18
        with:
          configurationFile: renovate-config.js
          token: ${{ steps.app-token.outputs.token }}
          # ⚠️ EXPLICITE, ET PAS LE DÉFAUT DE L'ACTION — sinon la version de Renovate
          # bouge TOUTE SEULE et sans revue. Le défaut de `renovate-version` est une
          # valeur interne à l'action : il valait '43' en v46.1.18 et '44' dès
          # v46.2.0. Or les bumps mineurs de `github-actions` sont AUTOMERGÉS ici
          # (cf. renovate-config.js) → l'outil qui garde tout le parc contre la
          # dérive dériverait lui-même, en silence, sur un bump d'action anodin.
          # ⚠️ Doit rester égale à `VERSION_RENOVATE` de validate-renovate-config.yml :
          # valider contre une version différente de celle qui tourne est exactement
          # ce qui a produit l'incident du 2026-08-11. Les deux se bumpent ENSEMBLE.
          renovate-version: "43"
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Journal STRUCTURÉ, en plus de la sortie console : l'étape suivante doit
          # statuer sur des faits, pas sur du texte coloré par des séquences ANSI.
          LOG_FILE: renovate-log.ndjson
          LOG_FILE_LEVEL: info

      # ⚠️ UN ÉCHEC DE LOOKUP NE DOIT PLUS ÊTRE SILENCIEUX. Quand une datasource ne
      # résout pas, Renovate n'ouvre aucune PR et écrit un avertissement dans le CORPS
      # de la Dependency Dashboard — le job reste VERT. L'épingle gèle alors comme si
      # personne ne la suivait, et c'est indiscernable de « rien à mettre à jour ».
      # Le rationale complet et les modes d'échec sont dans le script.
      #
      # ⚠️ `if: always()` : sans lui, un échec de Renovate lui-même sauterait le gate,
      # et l'absence de gate se lirait comme une absence de problème.
      #
      # ⚠️ DÉLIBÉRÉMENT BRUYANT : une indisponibilité amont passagère rendra le job
      # rouge le temps d'un run. Compromis assumé — un rouge qui se répare seul coûte
      # un coup d'œil, un gel silencieux a coûté des semaines.
      - name: Aucun échec de lookup (gate)
        if: always()
        run: python3 scripts/verifier-lookups.py renovate-log.ndjson
