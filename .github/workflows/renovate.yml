name: renovate
# Boucle de remediation CVE : Renovate self-hosted sur le runner interne (atteint le
# Harbor prive via hostRules). Ne gere QUE le digest de la base DHI (config global
# renovate-config.js). autodiscover => l'installation de l'App soma-base-bumper definit
# les repos consommateurs (som-portal, agent-infogerance). Cf. spec 2026-07-06.
on:
  schedule:
    - cron: "0 6,12,18 * * *"   # 3x/jour UTC (apres le mirror-dhi de 02:00)
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate LOG_LEVEL"
        default: "info"
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    runs-on: onprem-dev-base-images
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BASE_BUMPER_APP_ID }}
          private-key: ${{ secrets.BASE_BUMPER_PRIVATE_KEY }}
          owner: soma-smart
          # pas de 'repositories' => token sur TOUTES les installations de l'App = les consommateurs
      - name: Checkout (config global renovate-config.js)
        uses: actions/checkout@v7
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46
        with:
          configurationFile: renovate-config.js
          token: ${{ steps.app-token.outputs.token }}
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
