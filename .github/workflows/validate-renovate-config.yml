name: validate-renovate-config
# Valide `renovate-config.js` — le fichier qui pilote la boucle sur TOUS les dépôts
# consommateurs.
#
# ⚠️ POURQUOI CE GATE EXISTE. Une config Renovate invalide ne casse pas : elle se
# TAIT. Le job reste vert, aucune PR n'est ouverte, et rien ne distingue « manager
# rejeté » de « rien à mettre à jour ». Comme ce fichier est la SEULE config
# (`requireConfig: "ignored"`), une erreur ici rend muette la boucle entière, sur
# tous les dépôts à la fois.
#
# ⚠️ ET LA VERSION DU VALIDATEUR EST LE PIÈGE, PAS UN DÉTAIL. Valider contre une
# version différente de celle qui tourne est exactement ce qui a produit l'incident
# du 2026-08-11 : `multica-runtime` validait sa config contre Renovate 37.440.7
# alors que la boucle tourne en 43 — le gate rendait vert sur un schéma que
# l'instance n'utilise plus, et inversement rouge sur celui qu'elle attend.
# D'où le couplage ci-dessous : `VERSION_RENOVATE` DOIT rester égal au
# `renovate-version` DÉCLARÉ dans `renovate.yml`. Les deux se bumpent ENSEMBLE.
#
# ⚠️ Ce couplage n'a de sens que parce que `renovate.yml` déclare cette version
# EXPLICITEMENT. Tant qu'elle reposait sur le défaut de l'action, elle était
# invisible ET mobile : ce défaut valait '43' en v46.1.18 et '44' dès v46.2.0, et
# les bumps mineurs de `github-actions` sont automergés ici — la version aurait
# donc changé sans revue, ce gate restant vert en validant contre l'ancienne.
# Ne pas revenir au défaut implicite.
#
# ⚠️ Le nom n'est pas `RENOVATE_MAJOR` : tout `RENOVATE_*` est interprété par
# Renovate comme une option de config (`RENOVATE_MAJOR` → l'objet `major`).
# Inoffensif tant que la variable n'est pas passée au conteneur, mais c'est un
# piège armé pour le jour où quelqu'un l'ajoute au `-e`.
on:
  pull_request:
    paths:
      - "renovate-config.js"
      - ".github/workflows/renovate.yml"
      - ".github/workflows/validate-renovate-config.yml"
      # ⚠️ `scripts/**` est ICI parce que sans lui, une PR qui ne toucherait QUE le
      # gate de résolution ne jouerait pas ses propres contre-tests — le check ne se
      # déclencherait même pas, et son absence se lirait comme un vert. Un gate dont
      # les tests ne tournent pas quand il change est un gate décoratif.
      - "scripts/**"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: validate-renovate-config-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: onprem-dev-base-images
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Valider renovate-config.js
        env:
          # Doit rester égale au `renovate-version` déclaré dans renovate.yml (cf. en-tête).
          VERSION_RENOVATE: "43"
          # ⚠️ La config lit `process.env.HARBOR_*` pour ses `hostRules`. Sans ces
          # variables, elles vaudraient `undefined` et la validation échouerait sur
          # un motif de FORME plutôt que de fond. Valeurs factices : on valide la
          # forme, pas l'accès réel.
          #
          # ⚠️ CE COMMENTAIRE AFFIRMAIT AUPARAVANT « la config serait correcte en
          # production, où le workflow les fournit » — C'ÉTAIT FAUX, trouvé en revue
          # de #14 (2026-09-14) et CONFIRMÉ dans le log d'un run réel de production :
          # les deux mêmes erreurs (`hostRules[0].username/password should be a
          # string`) y figurent déjà. `renovate.yml` passe `HARBOR_USERNAME` et
          # `HARBOR_PASSWORD` sous leur nom NU, or l'action ne transmet PAS
          # l'environnement du runner tel quel : elle le FILTRE sur
          #   ^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|…)$
          # avant de construire son `docker run` — c'est la MÊME cause que celle qui a
          # forcé `RENOVATE_LOG_FILE` (cf. renovate.yml). Le `hostRule` Harbor ne
          # porte donc AUCUN credential en production depuis toujours ; la résolution
          # du digest du socle DHI — la dépendance n°1 de cette config — ne tient que
          # parce que le projet `dockerhub-proxy` répond en anonyme. Ticket séparé,
          # hors périmètre de ce gate qui valide la FORME, pas le transport.
          HARBOR_USERNAME: validation-placeholder
          HARBOR_PASSWORD: validation-placeholder
        # ⚠️ Par STDIN, pas par bind-mount : la résolution d'un montage de l'espace
        # de travail depuis le démon dind n'est pas garantie (leçon du gate jumeau de
        # `multica-runtime`). L'extension `.js` est OBLIGATOIRE — le validateur
        # `require()` le fichier, un `/tmp/r` sans extension ne serait pas chargé.
        run: |
          docker run --rm -i \
            -e HARBOR_USERNAME -e HARBOR_PASSWORD \
            "registry-dev.soma-smart.cloud/dockerhub-proxy/renovate/renovate:${VERSION_RENOVATE}" \
            sh -c 'cat > /tmp/renovate-config.js && renovate-config-validator /tmp/renovate-config.js' \
            < renovate-config.js

      # ⚠️ LE GATE ANTI-GEL EST LUI-MÊME TESTÉ, et ce n'est pas du zèle : un gate
      # anti-échec-silencieux non testé est un échec silencieux de plus. Les cas
      # couverts sont les chemins par lesquels il rendrait VERT sans rien prouver —
      # journal tronqué, journal au mauvais format, aucun dépôt traité. Deux d'entre
      # eux étaient ouverts dans sa première rédaction.
      - name: Contre-tests du gate de résolution
        run: python3 scripts/test_verifier_lookups.py

      - name: Contre-tests de la copie vers ghcr
        run: python3 scripts/test_copie_ghcr.py

      - name: Contre-tests du verdict Trivy
        run: python3 scripts/test_verdict_trivy.py

      - name: Manager et motifs doivent rester appariés
        # Ce que le validateur NE dit PAS : `custom.regex` activé sans
        # `customManagers`, ou l'inverse, est parfaitement VALIDE et totalement
        # inerte. C'est le piège exact qui a coûté six versions de multica.
        #
        # ⚠️ Contrôle sur l'OBJET CHARGÉ, pas sur le texte du fichier. Un grep
        # serait trompé par la modification la plus probable — commenter la ligne
        # `// "custom.regex",` pour déboguer : le motif resterait « trouvé », le
        # gate vert, et les trois managers muets. On charge donc le module et on
        # interroge la structure, ce qui résiste aussi au reformatage.
        env:
          VERSION_RENOVATE: "43"
          HARBOR_USERNAME: validation-placeholder
          HARBOR_PASSWORD: validation-placeholder
        run: |
          docker run --rm -i \
            -e HARBOR_USERNAME -e HARBOR_PASSWORD \
            "registry-dev.soma-smart.cloud/dockerhub-proxy/renovate/renovate:${VERSION_RENOVATE}" \
            sh -c 'cat > /tmp/renovate-config.js && node -e "
              const c = require(\"/tmp/renovate-config.js\");
              const actif = (c.enabledManagers || []).includes(\"custom.regex\");
              const n = (c.customManagers || []).length;
              if (actif && n === 0) {
                console.error(\"::error::custom.regex est active mais aucun customManager declare - inerte.\");
                process.exit(1);
              }
              if (!actif && n > 0) {
                console.error(\`::error::\${n} customManager(s) declare(s) mais custom.regex absent d enabledManagers - inerte.\`);
                process.exit(1);
              }
              console.log(\`OK - \${n} motif(s), custom.regex actif=\${actif}\`);
            "' \
            < renovate-config.js

      - name: Les motifs multica doivent matcher un Dockerfile type
        # Ce que « manager et motifs appariés » ne dit PAS : un motif qui ne matche
        # RIEN est valide et muet (la panne du 2026-08-11). Le script joue le VRAI
        # moteur regex de Renovate (RE2, qui accepte `(?m)`) sur des Dockerfile types :
        # exactement un des deux motifs doit matcher, une seule fois. Il fige aussi les
        # formes NON suivies (commentaire entre les deux ARG, CRLF…) : les élargir est un
        # geste délibéré. Le script est passé par variable d'environnement, comme la
        # config par STDIN : pas de montage de l'espace de travail vers le démon dind.
        env:
          VERSION_RENOVATE: "43"
          HARBOR_USERNAME: validation-placeholder
          HARBOR_PASSWORD: validation-placeholder
        run: |
          docker run --rm -i \
            -e HARBOR_USERNAME -e HARBOR_PASSWORD \
            -e TEST_JS="$(cat scripts/test_motifs_multica.mjs)" \
            "registry-dev.soma-smart.cloud/dockerhub-proxy/renovate/renovate:${VERSION_RENOVATE}" \
            sh -c 'cat > /tmp/renovate-config.js && printf "%s" "$TEST_JS" > /tmp/t.mjs && node /tmp/t.mjs' \
            < renovate-config.js

      - name: minimumReleaseAgeBehaviour doit être une valeur connue
        # ⚠️ `renovate-config-validator` NE VALIDE PAS la VALEUR de cette option — il
        # accepte n'importe quelle chaîne sans un mot (vérifié dans
        # `config/options/index.js` de l'image 43 : `allowedValues` existe dans le
        # schéma, mais le validateur ne le fait pas respecter). Une faute de frappe
        # ("timestamp-optionnal", l'orthographe française du mot) passerait ce gate
        # et retomberait sur le défaut `timestamp-required` EN SILENCE — c'est-à-dire
        # exactement le gel que cette ligne existe pour réparer (cf. son commentaire
        # dans renovate-config.js). On vérifie donc nous-mêmes, sur l'OBJET CHARGÉ.
        env:
          VERSION_RENOVATE: "43"
          HARBOR_USERNAME: validation-placeholder
          HARBOR_PASSWORD: validation-placeholder
        run: |
          docker run --rm -i \
            -e HARBOR_USERNAME -e HARBOR_PASSWORD \
            "registry-dev.soma-smart.cloud/dockerhub-proxy/renovate/renovate:${VERSION_RENOVATE}" \
            sh -c 'cat > /tmp/renovate-config.js && node -e "
              const c = require(\"/tmp/renovate-config.js\");
              const permises = [\"timestamp-required\", \"timestamp-optional\"];
              const v = c.minimumReleaseAgeBehaviour;
              if (v === undefined) {
                console.error(\"::error::minimumReleaseAgeBehaviour absent — retombe sur timestamp-required, gel silencieux possible (cf. #1368).\");
                process.exit(1);
              }
              if (!permises.includes(v)) {
                console.error(\`::error::minimumReleaseAgeBehaviour=\${JSON.stringify(v)} n est pas une valeur connue de Renovate 43 (attendu: \${permises.join(\" | \")}).\`);
                process.exit(1);
              }
              console.log(\`OK - minimumReleaseAgeBehaviour=\${v}\`);
            "' \
            < renovate-config.js
