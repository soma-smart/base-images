name: mirror-dhi
# Mirror durci des Docker Hardened Images (dhi.io) vers Harbor projet `base`.
# Le tag `base/python:<ver>` est VOLONTAIREMENT mouvant : redigesté à chaque
# rebuild DHI. Les consommateurs (apps) épinglent par digest via Renovate.
#
# Infra prête (runner ARC onprem-dev-base-images + secrets HARBOR_*/DOCKERHUB_*) —
# schedule nocturne actif depuis la validation du 2026-07-03 (run CI vert 4/4).
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC quotidien
  workflow_dispatch: {}
concurrency:
  group: mirror-dhi
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: onprem-dev-base-images
    strategy:
      fail-fast: false
      matrix:
        version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Install trivy
        # Le runner ARC tourne en non-root → pas d'écriture dans /usr/local/bin.
        # Installe dans un répertoire writable et l'ajoute au PATH des steps suivants.
        # Version ÉPINGLÉE, téléchargement rejoué et SHA-256 vérifié : même step que `build-python-slim.yml`, dont le
        # commentaire détaille pourquoi (`install.sh` sur `main`, et un `--retry` seul ne rejoue pas un échec DNS).
        # Le motif `TRIVY_VERSION` de `renovate-config.js` lit la ligne ci-dessous : ne pas la déplacer hors d'un `env:`
        # de workflow, ni la commenter, sans quoi elle gèle en silence. Les trois workflows se bumpent ensemble.
        env:
          TRIVY_VERSION: "0.76.1"
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$dir/$archive" "$base/$archive"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$dir/checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$dir" && grep -F " $archive" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$archive" -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # `GITHUB_PATH` ne vaut qu'à partir du step SUIVANT : appeler le binaire par son chemin.
          "$HOME/.local/bin/trivy" --version
      - name: Login dhi.io (pull DHI)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}
        run: echo "$DOCKERHUB_PAT" | docker login dhi.io -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Login Harbor (push base)
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "$HARBOR_PASSWORD" | docker login registry-dev.soma-smart.cloud -u "$HARBOR_USERNAME" --password-stdin
      - name: Pull DHI + retag
        env:
          DHI_REPO: dhi.io/python
        run: |
          set -eu
          docker pull "${DHI_REPO}:${{ matrix.version }}"
          docker tag  "${DHI_REPO}:${{ matrix.version }}" \
            "registry-dev.soma-smart.cloud/base/python:${{ matrix.version }}"
      - name: Trivy gate (CVE fixable Critical/High = échec)
        run: |
          trivy image --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 \
            "registry-dev.soma-smart.cloud/base/python:${{ matrix.version }}"
      - name: Push (idempotent — no-op si digest inchangé)
        run: docker push "registry-dev.soma-smart.cloud/base/python:${{ matrix.version }}"
